<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Momo</title>
    <meta name="theme-color" content="#f8f8f9" />
    <script>
      let savedTheme = null
      try {
        savedTheme = localStorage.getItem('momo.theme')
      } catch {}
      document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light'
    </script>
    <meta
      name="description"
      content="Momo is an open source agent mascot that dresses for the task, rendered in real time with WebGL."
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
    />
    <link rel="stylesheet" href="src/app.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side" id="side" aria-label="Chats">
        <div class="bar brand">
          <canvas class="brand-mark" data-look="rest" data-size="26" aria-hidden="true"></canvas
          ><span>Momo</span>
        </div>
        <button class="row new" id="newChat" type="button">New chat</button>
        <nav class="groups sc">
          <section class="group" id="chatsGroup" hidden>
            <h2 class="label">Chats</h2>
            <div class="list" id="chats"></div>
          </section>
          <section class="group">
            <h2 class="label">Examples</h2>
            <div class="list" id="examples"></div>
          </section>
        </nav>
      </aside>
      <main class="main">
        <header class="bar top">
          <button
            class="icon-btn side-toggle"
            id="sideToggle"
            type="button"
            aria-label="Chats and examples"
            aria-controls="side"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                d="M4 8h16M4 16h11"
              />
            </svg>
          </button>
          <span class="title" id="title">New chat</span>
          <div class="tools">
            <span class="status" id="status"><i aria-hidden="true"></i><span>Online</span></span>
            <button
              class="play-toggle"
              id="playToggle"
              type="button"
              aria-expanded="false"
              aria-controls="play"
            >
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  d="M4 7h9M17 7h3M4 17h3M11 17h9"
                />
                <circle
                  cx="15"
                  cy="7"
                  r="2.2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <circle
                  cx="9"
                  cy="17"
                  r="2.2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
              </svg>
              Playground
            </button>
            <button class="icon-btn theme" id="themeToggle" type="button">
              <svg class="moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M20.4 14.6A8.5 8.5 0 0 1 9.4 3.6a8.5 8.5 0 1 0 11 11Z"
                />
              </svg>
              <svg
                class="sun"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              >
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"
                />
              </svg>
            </button>
            <a
              class="icon-btn"
              id="repo"
              href="https://github.com/mortspace/momo"
              target="_blank"
              rel="noopener"
              aria-label="Momo on GitHub"
              title="Momo on GitHub"
            >
              <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"
                />
              </svg>
            </a>
          </div>
        </header>
        <div class="thread sc" id="thread">
          <div class="empty" id="empty">
            <div class="hero-slot big" id="slotBig"></div>
            <h1 class="ask">
              Who’s helping?
              <button
                class="bot-pick"
                id="botPick"
                type="button"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="botMenu"
              >
                <span id="botName">Momo</span
                ><svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M12 16.2c-.33 0-.63-.13-.87-.37l-5.4-5.4a1.2 1.2 0 0 1 1.7-1.7L12 13.3l4.57-4.57a1.2 1.2 0 0 1 1.7 1.7l-5.4 5.4c-.24.24-.54.37-.87.37Z"
                  />
                </svg>
              </button>
            </h1>
            <button
              class="new-bot"
              id="newBot"
              type="button"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="botForm"
            >
              + New bot
            </button>
          </div>
          <div class="messages" id="messages"></div>
        </div>
        <div class="dock">
          <p class="dock-note" id="dockNote" role="status" aria-live="polite"></p>
          <form class="composer" id="composer" autocomplete="off">
            <div class="hero-slot perch" id="slotPerch"></div>
            <textarea
              id="input"
              class="sc"
              rows="1"
              placeholder="Ask Momo anything"
              aria-label="Message Momo"
              enterkeyhint="send"
            ></textarea>
            <div class="composer-tools">
              <button
                type="button"
                class="mic"
                id="mic"
                aria-label="Dictate"
                aria-pressed="false"
                data-tip="Dictate"
                hidden
              ></button>
              <button type="submit" class="send" id="send" disabled>Send</button>
            </div>
          </form>
        </div>
      </main>
      <aside class="play" id="play" aria-label="Playground">
        <div class="bar play-bar"><span class="play-title">Playground</span></div>
        <div class="play-body sc">
          <section>
            <h2 class="label">Outfit</h2>
            <div class="pills" id="outfits"></div>
          </section>
          <section>
            <h2 class="label">Expression</h2>
            <div class="pills centred" id="exprs">
              <button type="button" data-e="happy">Happy</button
              ><button type="button" data-e="wink">Wink</button
              ><button type="button" data-e="sparkle">Idea</button
              ><button type="button" data-e="surprised">Surprised</button
              ><button type="button" data-e="sorry">Sorry</button
              ><button type="button" data-e="dizzy">Dizzy</button
              ><button type="button" data-e="sleepy">Sleepy</button>
            </div>
          </section>
          <section>
            <h2 class="label">Colour</h2>
            <div class="swatches" id="swatches"></div>
          </section>
          <section>
            <h2 class="label">Connection</h2>
            <div class="seg" id="conn" role="group" aria-label="Connection">
              <button type="button" data-on="1" class="on" aria-pressed="true">Online</button
              ><button type="button" data-on="0" aria-pressed="false">Offline</button>
            </div>
          </section>
          <section>
            <h2 class="label">Replies</h2>
            <div class="seg" id="replies" role="group" aria-label="Replies">
              <button type="button" data-instant="0" class="on" aria-pressed="true">Stream</button
              ><button type="button" data-instant="1" aria-pressed="false">Instant</button>
            </div>
          </section>
          <section>
            <h2 class="label">Brain</h2>
            <form class="keyform" id="keyForm" autocomplete="off">
              <input
                id="keyInput"
                type="password"
                placeholder="Jev API key"
                aria-label="Jev API key"
                spellcheck="false"
                autocomplete="off"
                autocapitalize="off"
              />
              <button type="submit" class="keybtn">Save</button>
            </form>
            <div class="keyrow" id="keyRow" hidden>
              <span class="keymask" id="keyMask"></span
              ><button type="button" class="keybtn" id="keyRemove">Remove</button>
            </div>
            <p class="brain-status" id="brainStatus" role="status">Using local rules</p>
            <p class="brain-status" id="writerStatus" hidden>Replies are written ahead of time</p>
            <p class="brain-last" id="brainLast" hidden></p>
          </section>
          <section>
            <h2 class="label">Avatar sizes</h2>
            <div class="ladder" id="ladder"></div>
          </section>
          <p class="perf" id="perf" hidden></p>
        </div>
      </aside>
    </div>
    <div class="pop bot-menu" id="botMenu" role="menu" aria-label="Bots">
      <div class="bot-list sc" id="botList"></div>
    </div>
    <form class="pop bot-form" id="botForm" role="dialog" aria-label="New bot" autocomplete="off">
      <div class="bot-form-head">
        <canvas id="botPreview" data-look="rest" data-size="44" aria-hidden="true"></canvas>
        <div>
          <h2>New bot</h2>
          <p id="botOutfit" aria-live="polite">No outfit yet</p>
        </div>
      </div>
      <input
        class="field"
        id="botNameInput"
        placeholder="Name"
        aria-label="Name"
        maxlength="24"
        spellcheck="false"
        required
      />
      <input
        class="field"
        id="botJobInput"
        placeholder="What it helps with"
        aria-label="What it helps with"
        maxlength="60"
      />
      <div class="bot-form-actions">
        <button type="button" class="keybtn" id="botCancel">Cancel</button>
        <button type="submit" class="keybtn primary" id="botCreate" disabled>Create bot</button>
      </div>
    </form>
    <div class="scrim" id="scrim"></div>
    <canvas id="hero" aria-hidden="true"></canvas>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
